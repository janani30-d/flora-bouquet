<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login - Flora Bouquet</title>

<link rel="stylesheet" href="css/style.css">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"/>

</head>

<body>

<button id="theme-btn" class="auth-theme-btn" aria-label="Toggle dark mode">

    <i class="fa-solid fa-moon"></i>

</button>

<button id="rtl-btn" class="auth-rtl-btn" aria-label="Toggle RTL mode">

    <i class="fa-solid fa-right-left"></i>

</button>

<!--=========================================
                LOGIN SECTION
==========================================-->

<section class="login-section">

    <div class="login-container">

        <!--=========================
            LEFT IMAGE
        ==========================-->

        <div class="login-image">

            <img src="images/login.jpg" alt="Flora Bouquet">

        </div>

        <!--=========================
            RIGHT CONTENT
        ==========================-->

        <div class="login-content">

            <!-- Logo -->

            <a class="login-logo" href="index.html" aria-label="Go to home page">

                <img src="images/logo.png" alt="Flora Bouquet">

            </a>

            <h2>Welcome Back</h2>

            <p>

                Login to your Flora Bouquet account

            </p>

            <!-- Login Form -->

            <form action="#" class="login-form">

                <!-- Email -->

                <div class="input-group">

                    <input type="email"
                           placeholder="Email Address"
                           required>

                    <i class="fa-solid fa-envelope"></i>

                </div>

                <!-- Password -->

                <div class="input-group password-box">

                    <input type="password"
                           id="password"
                           placeholder="Password"
                           required>

                    <i class="fa-solid fa-eye toggle-password"></i>

                </div>

                <!-- Remember -->

                <div class="login-options">

                    <label>

                        <input type="checkbox">

                        Remember Me

                    </label>

                    <a href="forgot-password.html">

                        Forgot Password?

                    </a>

                </div>

                <!-- Login Button -->

                <button type="submit"
                        class="login-submit-btn">

                    Login

                </button>

            </form>

            <!-- Divider -->

            <div class="divider">

                <span>Or Login With</span>

            </div>

            <!-- Social -->

            <div class="social-login">

                <a href="#">

                    <i class="fab fa-google"></i>

                </a>

                <a href="#">

                    <i class="fab fa-facebook-f"></i>

                </a>

                <a href="#">

                    <i class="fab fa-apple"></i>

                </a>

            </div>

            <!-- Register -->

            <div class="register-link">

                <p>

                    Don't have an account?

                    <a href="register.html">

                        Register

                    </a>

                </p>

            </div>

        </div>

    </div>

</section>

<script src="jss/script.js"></script>

</body>

</html>
