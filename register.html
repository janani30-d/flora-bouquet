<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Register - Flora Bouquet</title>

<link rel="icon" type="image/png" href="images/logo.png">

<link rel="stylesheet" href="css/style.css">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"/>

</head>

<body>

<button id="theme-btn" class="auth-theme-btn" aria-label="Toggle dark mode">

    <i class="fa-solid fa-moon"></i>

</button>

<button id="rtl-btn" class="auth-rtl-btn" aria-label="Toggle RTL mode">

    <i class="fa-solid fa-right-left"></i>

</button>



<!--=========================================
            REGISTER SECTION
==========================================-->

<section class="register-section">

    <div class="register-container">

        <!--=========================
            LEFT IMAGE
        ==========================-->

        <div class="register-image">

            <img src="images/register.jpg"
                 alt="Flora Bouquet Register">

        </div>

        <!--=========================
            RIGHT CONTENT
        ==========================-->

        <div class="register-content">

            <!-- Logo -->

            <a class="register-logo" href="index.html" aria-label="Go to home page">

                <img src="images/logo.png"
                     alt="Flora Bouquet">

            </a>

            <h2>Create Account</h2>

            <p>

                Join Flora Bouquet and enjoy a beautiful floral shopping experience.

            </p>

            <!--=========================
                REGISTER FORM
            ==========================-->

            <form class="register-form" action="#">

                <!-- First Name -->

                <div class="register-group">

                    <input type="text"
                           placeholder="First Name"
                           required>

                    
                </div>

                <!-- Last Name -->

                <div class="register-group">

                    <input type="text"
                           placeholder="Last Name"
                           required>

                    

                </div>

                <!-- Email -->

                <div class="register-group">

                    <input type="email"
                           placeholder="Email Address"
                           required>

                    

                </div>

                <!-- Phone -->

                <div class="register-group">

                    <input type="tel"
                           placeholder="Phone Number"
                           required>

                    

                </div>

                <!-- Password -->

                <div class="register-group register-password">

                    <input type="password"
                           id="registerPassword"
                           placeholder="Password"
                           required>

                    <i class="fa-solid fa-eye toggle-register-password"></i>

                </div>

                <!-- Confirm Password -->

                <div class="register-group register-password">

                    <input type="password"
                           id="confirmPassword"
                           placeholder="Confirm Password"
                           required>

                    <i class="fa-solid fa-eye toggle-confirm-password"></i>

                </div>

                <!-- Terms -->

                <div class="register-options">

                    <label>

                        <input type="checkbox"
                               required>

                        I agree to the

                        <a href="#">

                            Terms & Conditions

                        </a>

                    </label>

                </div>

                <!-- Button -->

                <button type="submit"
                        class="register-btn">

                    Create Account

                </button>

            </form>

            <!-- Divider -->

            <div class="register-divider">

                <span>Or Sign Up With</span>

            </div>

            <!-- Social Login -->

            <div class="social-buttons">

    <a href="#" class="google-btn">

<svg class="google-logo" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
    <path fill="#4285F4" d="M23.5 12.3c0-.8-.1-1.6-.2-2.3H12v4.4h6.5c-.3 1.4-1.1 2.7-2.3 3.5v2.9h3.7c2.2-2 3.6-5 3.6-8.5z"/>
    <path fill="#34A853" d="M12 24c3.2 0 5.9-1.1 7.9-2.9l-3.7-2.9c-1 .7-2.4 1.1-4.2 1.1-3.1 0-5.7-2.1-6.6-4.9H1.6v3C3.5 21.3 7.4 24 12 24z"/>
    <path fill="#FBBC05" d="M5.4 14.4c-.2-.7-.4-1.5-.4-2.4s.1-1.6.4-2.4v-3H1.6C.6 8.2 0 10.1 0 12s.6 3.8 1.6 5.4l3.8-3z"/>
    <path fill="#EA4335" d="M12 4.7c1.7 0 3.3.6 4.5 1.8l3.3-3.3C17.9 1.2 15.2 0 12 0 7.4 0 3.5 2.7 1.6 6.6l3.8 3C6.3 6.8 8.9 4.7 12 4.7z"/>
</svg>

</a>

    <a href="#" class="apple-btn">

        <i class="fab fa-apple"></i>

    </a>

    <a href="#" class="facebook-btn">

        <i class="fab fa-facebook-f"></i>

    </a>

</div>
            <!-- Login Link -->

            <div class="register-login-link">

                <p>

                    Already have an account?

                    <a href="login.html">

                        Login

                    </a>

                </p>

            </div>

        </div>

    </div>

</section>

<script src="jss/script.js"></script>

</body>

</html>
